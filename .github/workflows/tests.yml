name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.9', '3.10', '3.11']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip packages
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov black flake8

    - name: Lint with flake8
      run: |
        # Stop build if there are Python syntax errors or undefined names
        flake8 examples/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings
        flake8 examples/ tests/ --count --exit-zero --max-line-length=100 --statistics

    - name: Check code formatting with black
      run: |
        black --check examples/ tests/ --line-length=100

    - name: Run tests with pytest
      run: |
        pytest tests/ -v --cov=examples --cov-report=xml --cov-report=term
      continue-on-error: true  # Allow tests to continue even if some fail (API compatibility issues)

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
      if: matrix.python-version == '3.10' && matrix.os == 'ubuntu-latest'

  docs-check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Check for broken links in README
      uses: gaurav-nelson/github-action-markdown-link-check@v1
      with:
        use-quiet-mode: 'yes'
        config-file: '.github/mlc_config.json'
      continue-on-error: true  # Don't fail CI on link checks

    - name: Spell check
      uses: rojopolis/spellcheck-github-actions@0.37.0
      with:
        config_path: .github/spellcheck-settings.yml
      continue-on-error: true  # Don't fail CI on spelling

  notify:
    runs-on: ubuntu-latest
    needs: [test, docs-check]
    if: always()
    steps:
    - name: Status
      run: |
        echo "Tests completed!"
        echo "Test job status: ${{ needs.test.result }}"
        echo "Docs check status: ${{ needs.docs-check.result }}"
